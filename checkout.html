<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Robo Orion</title>
    <meta name="description" content="Complete your order at Robo Orion. Review your cart, apply coupons, select delivery area and place your order via WhatsApp.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="asset/img/logo.png">
    <meta name="theme-color" content="#2563eb">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;700&family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous">
    <link href="asset/css/main.css" rel="stylesheet">
    <link href="asset/css/cart.css" rel="stylesheet">

    <style>
        body { font-family: 'Ubuntu', sans-serif; }

        /* ── Checkout Layout ── */
        .co-wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem 1rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }
        @media (min-width: 768px) {
            .co-wrap { grid-template-columns: 1fr 380px; }
        }

        /* ── Panel ── */
        .co-panel {
            background: #fff;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
        }
        .co-panel-header {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid #e2e8f0;
            font-weight: 700;
            font-size: 0.95rem;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #f8fafc;
        }
        .co-panel-header i { color: #2563eb; }

        /* ── Cart Items ── */
        .co-items { padding: 0; }
        .co-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.85rem 1.25rem;
            border-bottom: 1px solid #f1f5f9;
        }
        .co-item:last-child { border-bottom: none; }
        .co-item-img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            background: #f1f5f9;
            flex-shrink: 0;
        }
        .co-item-info { flex: 1; min-width: 0; }
        .co-item-name {
            font-size: 0.8rem;
            font-weight: 600;
            color: #1e293b;
            line-height: 1.3;
            margin-bottom: 0.2rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .co-item-code { font-size: 0.7rem; color: #94a3b8; margin-bottom: 0.25rem; }
        .co-item-price { font-size: 0.78rem; color: #64748b; }

        .co-qty-wrap { text-align: right; flex-shrink: 0; }
        .co-qty-controls {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            justify-content: flex-end;
            margin-bottom: 0.25rem;
        }
        .co-qty-btn {
            width: 26px; height: 26px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s;
        }
        .co-qty-btn:hover { background: #e0e7ff; color: #2563eb; }
        .co-qty-num { font-size: 0.85rem; font-weight: 600; color: #1e293b; min-width: 20px; text-align: center; }
        .co-item-subtotal { font-size: 0.82rem; font-weight: 700; color: #2563eb; }
        .co-remove-btn {
            font-size: 0.68rem;
            color: #94a3b8;
            background: none;
            border: none;
            cursor: pointer;
            margin-top: 0.25rem;
        }
        .co-remove-btn:hover { color: #ef4444; }

        /* ── Empty State ── */
        .co-empty {
            text-align: center;
            padding: 3rem 1rem;
            color: #94a3b8;
        }
        .co-empty p { font-size: 1rem; font-weight: 600; margin-top: 1rem; color: #64748b; }
        .co-empty span { font-size: 0.8rem; }
        .co-empty a { color: #2563eb; text-decoration: underline; }

        /* ── Order Summary Panel ── */
        .co-summary { padding: 1.25rem; display: flex; flex-direction: column; gap: 0.75rem; }

        .co-summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.82rem;
            color: #64748b;
            padding: 0.1rem 0;
        }
        .co-summary-row span:last-child { font-weight: 600; color: #1e293b; }

        .co-discount-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.82rem;
            font-weight: 600;
            color: #16a34a;
            padding: 0.1rem 0;
        }

        .co-total-row {
            display: flex;
            justify-content: space-between;
            font-size: 1rem;
            font-weight: 700;
            color: #1e293b;
            padding: 0.75rem 0 0;
            border-top: 2px solid #e2e8f0;
            margin-top: 0.25rem;
        }
        .co-total-row span:last-child { color: #2563eb; font-size: 1.1rem; }

        /* ── Delivery Options ── */
        .co-delivery-section {
            padding: 0.75rem;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .co-delivery-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 0.5rem;
        }
        .co-delivery-options { display: flex; flex-direction: column; gap: 0.4rem; }
        .co-delivery-option {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.45rem 0.65rem;
            border-radius: 6px;
            border: 1.5px solid #e2e8f0;
            cursor: pointer;
            background: #fff;
            transition: border-color 0.15s, background 0.15s;
        }
        .co-delivery-option input[type="radio"] { accent-color: #2563eb; width: 15px; height: 15px; }
        .co-delivery-option.active { border-color: #2563eb; background: #eff6ff; }
        .co-delivery-name { font-size: 0.8rem; font-weight: 500; color: #1e293b; flex: 1; }
        .co-delivery-price { font-size: 0.78rem; font-weight: 700; color: #2563eb; }

        /* ── Coupon ── */
        .co-coupon-row { display: flex; gap: 0.4rem; }
        .co-coupon-input {
            flex: 1;
            padding: 0.5rem 0.65rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 6px;
            font-size: 0.78rem;
            outline: none;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: border-color 0.15s;
        }
        .co-coupon-input:focus { border-color: #2563eb; }
        .co-coupon-btn {
            padding: 0.5rem 0.9rem;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }
        .co-coupon-btn:hover { background: #1d4ed8; }
        .co-coupon-msg { font-size: 0.75rem; font-weight: 500; margin-top: 0.3rem; }
        .co-coupon-msg.success { color: #16a34a; }
        .co-coupon-msg.error   { color: #dc2626; }

        /* ── WhatsApp Button ── */
        .co-whatsapp-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.85rem 1rem;
            background: #16a34a;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .co-whatsapp-btn:hover  { background: #15803d; }
        .co-whatsapp-btn:active { transform: scale(0.98); }
        .co-whatsapp-btn:disabled { background: #94a3b8; cursor: not-allowed; }

        /* ── Back link ── */
        .co-back {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.82rem;
            color: #2563eb;
            text-decoration: none;
            margin-bottom: 1rem;
        }
        .co-back:hover { text-decoration: underline; }

        /* ── Divider ── */
        .co-divider { border: none; border-top: 1px solid #e2e8f0; margin: 0; }
    </style>
</head>

<body class="bg-white">

    <!-- Nav -->
    <header class="sticky inset-0 z-50 border-b border-slate-100 bg-white/80 backdrop-blur-lg shadow-sm">
        <nav class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4 lg:px-12">
            <a href="index.html" class="flex items-center gap-2">
                <div class="w-9 h-9 rounded-full overflow-hidden shadow-xl ring-1 ring-gray-400">
                    <img src="asset/img/logo.png" loading="lazy" class="w-full h-full object-cover" alt="Robo Orion Logo">
                </div>
                <span class="text-xl font-bold whitespace-nowrap">
                    <span class="text-blue-500 font-ubuntu">Orion</span>

            <div class="flex items-center gap-2 text-sm text-gray-500">
                <i class="fa-solid fa-lock text-green-500"></i>

    <!-- Main -->
    <main>
        <div class="co-wrap">

            <!-- Back link -->
            <div class="md:col-span-2">
                <a href="product.html" class="co-back">
                    <i class="fa-solid fa-arrow-left text-xs"></i>
                    Continue Shopping
                </a>
                <h1 class="text-2xl font-bold text-gray-800 mb-0">Checkout</h1>
            </div>

            <!-- LEFT: Cart Items -->
            <div class="co-panel">
                <div class="co-panel-header">
                    <i class="fa-solid fa-cart-shopping"></i>
                    Your Items
                    <span id="co-item-badge" class="ml-auto text-xs font-semibold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full"></span>
                </div>
                <div class="co-items" id="co-items"></div>
            </div>

            <!-- RIGHT: Order Summary -->
            <div>
                <div class="co-panel">
                    <div class="co-panel-header">
                        <i class="fa-solid fa-receipt"></i>
                        Order Summary
                    </div>
                    <div class="co-summary">

                        <!-- Delivery -->
                        <div class="co-delivery-section">
                            <div class="co-delivery-label">🚚 Delivery Area</div>
                            <div class="co-delivery-options">
                                <label class="co-delivery-option active" id="co-delivery-inside-label">
                                    <input type="radio" name="co-delivery" id="co-delivery-inside" value="70" checked>
                                    <span class="co-delivery-name">Inside Dhaka</span>
                                    <span class="co-delivery-price">BDT 70</span>
                                </label>
                                <label class="co-delivery-option" id="co-delivery-outside-label">
                                    <input type="radio" name="co-delivery" id="co-delivery-outside" value="120">
                                    <span class="co-delivery-name">Outside Dhaka</span>
                                    <span class="co-delivery-price">BDT 120</span>
                                </label>
                            </div>
                        </div>

                        <hr class="co-divider">

                        <!-- Coupon -->
                        <div>
                            <div class="co-delivery-label mb-1">🎟 Coupon Code</div>

                                <input type="text" id="co-coupon-input" placeholder="Enter coupon code" class="co-coupon-input">
                                <button class="co-coupon-btn" onclick="coApplyCoupon()">Apply</button>

                        <div class="co-summary-row">

                            <span>Total</span>
                            <span id="co-total">BDT 0</span>

                        <!-- WhatsApp Order -->
                        <button class="co-whatsapp-btn" id="co-wa-btn" onclick="coOrderWhatsApp()" disabled>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">

                            </svg>

                    </div>

    </main>

    <script>
    /* ── CONFIG ── */
    const WA_NUMBER  = '8801999506021';
    const CART_KEY   = 'robo_orion_cart';
    const PROD_KEY   = 'robo_orion_products';
    const COUPON_KEY = 'robo_orion_coupon';
    const STORE_NAME = 'Robo Orion';

    const COUPONS = {
        'ROBOORION10': { discount: 10, type: 'percent', expiry: '2026-12-31', label: '10% off' },
        'ROBOORION45': { discount: 45, type: 'flat',    expiry: '2026-12-31', label: 'BDT 45 off' },
        'ORION50':     { discount: 50, type: 'flat',    expiry: '2026-06-30', label: 'BDT 50 off' },
    };

    /* ── STATE ── */
    var appliedCoupon = null;

    function getCart() {
        try { return JSON.parse(localStorage.getItem(CART_KEY)) || []; } catch { return []; }
    }
    function saveCart(cart) {
        localStorage.setItem(CART_KEY, JSON.stringify(cart));
    }
    function getProducts() {
        try { return JSON.parse(localStorage.getItem(PROD_KEY)) || {}; } catch { return {}; }
    }
    function findProduct(id) {
        return getProducts()[id] || null;
    }
    function fixImg(img) {
        if (!img) return '';
        if (img.startsWith('http')) return img;
        if (img.startsWith('../')) return img.replace('../', '');
        return img;
    }
    function getDelivery() {
        var outside = document.getElementById('co-delivery-outside');
        return outside && outside.checked ? 120 : 70;
    }
    function calcDiscount(total) {
        if (!appliedCoupon) return 0;
        if (appliedCoupon.type === 'percent') return Math.round(total * appliedCoupon.discount / 100);
        if (appliedCoupon.type === 'flat')    return Math.min(appliedCoupon.discount, total);
        return 0;
    }

    /* ── RENDER ITEMS ── */
    function renderItems() {
        var cart    = getCart();
        var itemsEl = document.getElementById('co-items');
        var badge   = document.getElementById('co-item-badge');
        var waBtn   = document.getElementById('co-wa-btn');
        var totalQty = cart.reduce(function(s, i) { return s + i.qty; }, 0);

        if (badge) badge.textContent = totalQty + ' item' + (totalQty !== 1 ? 's' : '');

        if (cart.length === 0) {
            itemsEl.innerHTML = '<div class="co-empty"><i class="fa-solid fa-box-open text-4xl text-gray-300"></i><p>Your cart is empty</p><span>Go back and <a href="product.html">browse products</a></span></div>';
            if (waBtn) waBtn.disabled = true;
            updateSummary();
            return;
        }

        if (waBtn) waBtn.disabled = false;

        itemsEl.innerHTML = cart.map(function(item) {
            var p = findProduct(item.id);
            if (!p) return '';
            var subtotal = p.price * item.qty;
            var img = fixImg(p.img);
            return '<div class="co-item">' +
                '<img class="co-item-img" src="' + img + '" alt="' + p.name + '" onerror="this.style.background=\'#f1f5f9\';this.src=\'\'">' +
                '<div class="co-item-info">' +
                    '<div class="co-item-name">' + p.name + '</div>' +
                    '<div class="co-item-code">' + p.code + '</div>' +
                    '<div class="co-item-price">BDT ' + p.price + ' each</div>' +
                '</div>' +
                '<div class="co-qty-wrap">' +
                    '<div class="co-qty-controls">' +
                        '<button class="co-qty-btn" onclick="changeQty(\'' + p.id + '\', -1)">−</button>' +
                        '<span class="co-qty-num">' + item.qty + '</span>' +
                        '<button class="co-qty-btn" onclick="changeQty(\'' + p.id + '\', 1)">+</button>' +
                    '</div>' +
                    '<div class="co-item-subtotal">BDT ' + subtotal + '</div>' +
                    '<button class="co-remove-btn" onclick="removeItem(\'' + p.id + '\')">✕ remove</button>' +
                '</div>' +
            '</div>';
        }).join('');

        updateSummary();
    }

    /* ── UPDATE SUMMARY ── */
    function updateSummary() {
        var cart     = getCart();
        var total    = cart.reduce(function(s, i) {
            var p = findProduct(i.id);
            return s + (p ? p.price * i.qty : 0);
        }, 0);

        var discount = calcDiscount(total);
        var delivery = getDelivery();
        var grand    = total - discount + delivery;

        document.getElementById('co-subtotal').textContent    = 'BDT ' + total;
        document.getElementById('co-delivery-val').textContent = 'BDT ' + delivery;
        document.getElementById('co-total').textContent        = 'BDT ' + grand;

        var discountRow = document.getElementById('co-discount-row');
        if (discount > 0 && appliedCoupon) {
            discountRow.style.display = 'flex';
            document.getElementById('co-discount-label').textContent = 'Discount (' + appliedCoupon.code + ')';
            document.getElementById('co-discount-val').textContent   = '− BDT ' + discount;
        } else {
            discountRow.style.display = 'none';
        }
    }

    /* ── CART ACTIONS ── */
    function changeQty(id, delta) {
        var cart = getCart();
        var item = cart.find(function(i) { return i.id === id; });
        if (!item) return;
        item.qty += delta;
        if (item.qty <= 0) cart.splice(cart.indexOf(item), 1);
        saveCart(cart);
        renderItems();
    }
    function removeItem(id) {
        saveCart(getCart().filter(function(i) { return i.id !== id; }));
        renderItems();
    }

    /* ── COUPON ── */
    function coApplyCoupon() {
        var input  = document.getElementById('co-coupon-input');
        var msgEl  = document.getElementById('co-coupon-msg');
        var code   = input.value.trim().toUpperCase();
        var coupon = COUPONS[code];
        var today  = new Date().toISOString().split('T')[0];

        msgEl.className = 'co-coupon-msg';

        if (!coupon) {
            appliedCoupon = null;
            localStorage.removeItem(COUPON_KEY);
            msgEl.classList.add('error');
            msgEl.textContent = '✕ Invalid coupon code.';
            updateSummary();
            return;
        }
        if (today > coupon.expiry) {
            appliedCoupon = null;
            localStorage.removeItem(COUPON_KEY);
            msgEl.classList.add('error');
            msgEl.textContent = '✕ This coupon expired on ' + coupon.expiry + '.';
            updateSummary();
            return;
        }

        // Always replace previous — only latest counts
        appliedCoupon = Object.assign({ code: code }, coupon);
        localStorage.setItem(COUPON_KEY, JSON.stringify(appliedCoupon));
        msgEl.classList.add('success');
        msgEl.textContent = '✓ Coupon applied — ' + coupon.label + '!';
        updateSummary();
    }

    /* ── WHATSAPP ORDER ── */
    function coOrderWhatsApp() {
        var cart = getCart();
        if (cart.length === 0) return;

        var total = 0;
        var lines = [];

        cart.forEach(function(item, idx) {
            var p = findProduct(item.id);
            if (!p) return;
            var subtotal = p.price * item.qty;
            total += subtotal;
            lines.push((idx + 1) + '. ' + p.name + '\n   Code: ' + p.code + '\n   Qty: ' + item.qty + ' × BDT ' + p.price + ' = BDT ' + subtotal);
        });

        var discount = calcDiscount(total);
        var delivery = getDelivery();
        var grand    = total - discount + delivery;
        var zone     = delivery === 70 ? 'Inside Dhaka' : 'Outside Dhaka';

        var message = '🛒 *New Order from ' + STORE_NAME + '*\n\n' +
            lines.join('\n\n') + '\n\n' +
            '─────────────────\n' +
            (appliedCoupon ? '🎟 *Coupon: ' + appliedCoupon.code + ' (' + appliedCoupon.label + ')* — − BDT ' + discount + '\n' : '') +
            '🛵 *Delivery: ' + zone + ' — BDT ' + delivery + '*\n' +
            '💰 *Total: BDT ' + grand + '*\n' +
            '─────────────────\n' +
            'Please confirm my order. Thank you! 🙏';

        window.open('https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(message), '_blank');
    }

    /* ── DELIVERY LISTENERS ── */
    function initDelivery() {
        var inside        = document.getElementById('co-delivery-inside');
        var outside       = document.getElementById('co-delivery-outside');
        var insideLabel   = document.getElementById('co-delivery-inside-label');
        var outsideLabel  = document.getElementById('co-delivery-outside-label');
        if (!inside || !outside) return;
        inside.addEventListener('change', function() {
            insideLabel.classList.add('active');
            outsideLabel.classList.remove('active');
            updateSummary();
        });
        outside.addEventListener('change', function() {
            outsideLabel.classList.add('active');
            insideLabel.classList.remove('active');
            updateSummary();
        });
    }

    /* ── RESTORE SAVED COUPON ── */
    function restoreCoupon() {
        try {
            var saved = localStorage.getItem(COUPON_KEY);
            if (!saved) return;
            appliedCoupon = JSON.parse(saved);
            var input = document.getElementById('co-coupon-input');
            var msgEl = document.getElementById('co-coupon-msg');
            if (input) input.value = appliedCoupon.code;
            if (msgEl) {
                msgEl.className = 'co-coupon-msg success';
                msgEl.textContent = '✓ Coupon applied — ' + appliedCoupon.label + '!';
            }
        } catch(e) { appliedCoupon = null; }
    }

    /* ── CROSS-TAB SYNC ── */
    window.addEventListener('storage', function(e) {
        if (e.key === CART_KEY) renderItems();
    });

    /* ── INIT ── */
    document.addEventListener('DOMContentLoaded', function() {
        restoreCoupon();
        initDelivery();
        renderItems();
    });
    </script>

</body>
</html>
